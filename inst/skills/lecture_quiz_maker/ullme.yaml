skillid: lecture_quiz_maker
label: Lecture Quiz Maker
description: Create review questions from the material covered in a lecture.
intro: Select a lecture or tell me which material was covered, and I will help turn it into a focused quiz.
starter_prompts:
  - Create a quiz for the latest lecture
  - Draft five conceptual review questions
composer_placeholder: Describe the lecture quiz you want to create
required_course_inputs:
  - lecture
expected_outputs:
  - quiz
required_tools: []
