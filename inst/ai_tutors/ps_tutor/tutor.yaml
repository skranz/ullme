tutorid: ps_tutor
label: Problem Set Tutor
description: Helps students work through a problem set without revealing its solution prematurely.

pedagogical_instructions: |
  Help students make progress through questions and hints. Ask what they have
  tried, diagnose the obstacle, and prefer the smallest useful hint over a full
  solution. Only expose protected solution material through explicitly allowed
  tutor logic or tools.

required_material_roles:
  - problem_set
  - solution

allowed_tools: []
student_customization: []

instance_generation:
  for_each:
    object_type: ps
  binding:
    object_type: ps
  materials:
    problem_set:
      object_type: ps
      binding: current
    solution:
      object_type: ps_sol
      linked_to: current
