$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://ullme.local/specs/course.schema.yaml"
title: "course.yaml"
description: "Schema for a course folder configuration file."
type: object
additionalProperties: false
required:
  - courseid
  - coursename
properties:
  courseid:
    type: string
    description: "Short stable course identifier used in folder names and references."
    minLength: 1
    pattern: "^[A-Za-z][A-Za-z0-9_-]*$"
    examples:
      - micro
      - macro_1
  coursename:
    type: string
    description: "Human-readable course name."
    examples:
      - Microeconomics
examples:
  - courseid: micro
    coursename: Microeconomics
