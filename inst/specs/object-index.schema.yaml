$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://ullme.local/specs/object-index.schema.yaml"
title: "Course object index"
description: "Maps an uLLMe object type to ordered files or events in one course."
type: object
additionalProperties: false
required:
  - oid
  - objects
properties:
  oid:
    type: string
    pattern: "^[A-Za-z][A-Za-z0-9_-]*$"
  objects:
    type: array
    items:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        order:
          type: integer
          minimum: 1
        files:
          type: array
          items:
            oneOf:
              - type: string
              - type: object
                required:
                  - path
                properties:
                  path:
                    type: string
                  format:
                    type: string
                  role:
                    type: string
        linked_to:
          type: string
